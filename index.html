<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Змейка</title>
<style>
  :root {
    --bg: #0f172a;
    --board: #111827;
    --grid: #1f2937;
    --snake: #22c55e;
    --snake-head: #4ade80;
    --food: #ef4444;
    --text: #e5e7eb;
    --accent: #38bdf8;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 16px;
  }
  h1 {
    margin: 0;
    font-size: 1.4rem;
    letter-spacing: 0.05em;
  }
  .hud {
    display: flex;
    gap: 24px;
    font-variant-numeric: tabular-nums;
    font-size: 1rem;
  }
  .hud span { color: var(--accent); font-weight: 700; }
  #board {
    background: var(--board);
    border: 2px solid var(--grid);
    border-radius: 12px;
    image-rendering: pixelated;
    touch-action: none;
    max-width: 90vw;
    max-height: 60vh;
  }
  .hint {
    font-size: 0.85rem;
    opacity: 0.7;
    text-align: center;
    max-width: 420px;
  }
  #overlay {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.85);
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 12px;
    text-align: center;
    padding: 16px;
  }
  #overlay.show { display: flex; }
  #overlay h2 { margin: 0; font-size: 1.6rem; }
  button {
    background: var(--accent);
    border: none;
    color: #0f172a;
    font-weight: 700;
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 1rem;
    cursor: pointer;
  }
  button:active { transform: scale(0.97); }
  .touch-pad {
    display: grid;
    grid-template-columns: repeat(3, 56px);
    grid-template-rows: repeat(3, 56px);
    gap: 6px;
    margin-top: 6px;
  }
  .touch-pad button {
    background: var(--grid);
    color: var(--text);
    font-size: 1.3rem;
    padding: 0;
  }
  .touch-pad .up    { grid-column: 2; grid-row: 1; }
  .touch-pad .left  { grid-column: 1; grid-row: 2; }
  .touch-pad .right { grid-column: 3; grid-row: 2; }
  .touch-pad .down  { grid-column: 2; grid-row: 3; }
  @media (hover: hover) {
    .touch-pad { display: none; }
  }
</style>
</head>
<body>
  <h1>🐍 ЗМЕЙКА</h1>
  <div class="hud">
    <div>Счёт: <span id="score">0</span></div>
    <div>Рекорд: <span id="best">0</span></div>
  </div>
  <canvas id="board" width="400" height="400"></canvas>
  <div class="hint">Стрелки / WASD — управление, пробел — пауза. На телефоне — свайпы или кнопки ниже.</div>

  <div class="touch-pad" id="touchPad">
    <button class="up" data-dir="up">▲</button>
    <button class="left" data-dir="left">◀</button>
    <button class="right" data-dir="right">▶</button>
    <button class="down" data-dir="down">▼</button>
  </div>

  <div id="overlay">
    <h2 id="overlayTitle">Змейка</h2>
    <p id="overlayText">Готовы начать?</p>
    <button id="startBtn">Играть</button>
  </div>

<script>
(function () {
  "use strict";

  const canvas = document.getElementById("board");
  const ctx = canvas.getContext("2d");
  const scoreEl = document.getElementById("score");
  const bestEl = document.getElementById("best");
  const overlay = document.getElementById("overlay");
  const overlayTitle = document.getElementById("overlayTitle");
  const overlayText = document.getElementById("overlayText");
  const startBtn = document.getElementById("startBtn");
  const touchPad = document.getElementById("touchPad");

  const GRID = 20;
  const CELL = canvas.width / GRID;
  const STORAGE_KEY = "snake-best-score";

  let snake, dir, nextDir, food, score, best, running, paused, tickMs, loopId;

  function loadBest() {
    try {
      return parseInt(localStorage.getItem(STORAGE_KEY) || "0", 10) || 0;
    } catch (e) {
      return 0;
    }
  }

  function saveBest(value) {
    try {
      localStorage.setItem(STORAGE_KEY, String(value));
    } catch (e) {
      /* localStorage недоступен — просто не сохраняем рекорд */
    }
  }

  function randCell() {
    return {
      x: Math.floor(Math.random() * GRID),
      y: Math.floor(Math.random() * GRID),
    };
  }

  function placeFood() {
    let cell;
    do {
      cell = randCell();
    } while (snake.some((s) => s.x === cell.x && s.y === cell.y));
    food = cell;
  }

  function resetGame() {
    snake = [
      { x: 9, y: 10 },
      { x: 8, y: 10 },
      { x: 7, y: 10 },
    ];
    dir = { x: 1, y: 0 };
    nextDir = dir;
    score = 0;
    tickMs = 130;
    paused = false;
    placeFood();
    scoreEl.textContent = score;
  }

  function gameOver() {
    running = false;
    clearTimeout(loopId);
    if (score > best) {
      best = score;
      saveBest(best);
      bestEl.textContent = best;
    }
    overlayTitle.textContent = "Игра окончена";
    overlayText.textContent = `Счёт: ${score}. Попробуем ещё раз?`;
    startBtn.textContent = "Играть снова";
    overlay.classList.add("show");
  }

  function step() {
    if (paused) {
      loopId = setTimeout(step, tickMs);
      return;
    }
    dir = nextDir;
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    if (head.x < 0 || head.y < 0 || head.x >= GRID || head.y >= GRID) {
      draw();
      gameOver();
      return;
    }
    if (snake.some((s) => s.x === head.x && s.y === head.y)) {
      draw();
      gameOver();
      return;
    }

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
      score += 10;
      scoreEl.textContent = score;
      placeFood();
      tickMs = Math.max(70, tickMs - 2);
    } else {
      snake.pop();
    }

    draw();
    loopId = setTimeout(step, tickMs);
  }

  function draw() {
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue("--board");
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue("--grid");
    ctx.lineWidth = 1;
    for (let i = 1; i < GRID; i++) {
      ctx.beginPath();
      ctx.moveTo(i * CELL, 0);
      ctx.lineTo(i * CELL, canvas.height);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(0, i * CELL);
      ctx.lineTo(canvas.width, i * CELL);
      ctx.stroke();
    }

    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue("--food");
    roundedRect(food.x * CELL + 2, food.y * CELL + 2, CELL - 4, CELL - 4, 6);
    ctx.fill();

    snake.forEach((seg, i) => {
      ctx.fillStyle = i === 0
        ? getComputedStyle(document.documentElement).getPropertyValue("--snake-head")
        : getComputedStyle(document.documentElement).getPropertyValue("--snake");
      roundedRect(seg.x * CELL + 1, seg.y * CELL + 1, CELL - 2, CELL - 2, 4);
      ctx.fill();
    });
  }

  function roundedRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function setDirection(name) {
    const map = {
      up: { x: 0, y: -1 },
      down: { x: 0, y: 1 },
      left: { x: -1, y: 0 },
      right: { x: 1, y: 0 },
    };
    const next = map[name];
    if (!next) return;
    // запрет разворота на 180°
    if (next.x === -dir.x && next.y === -dir.y) return;
    nextDir = next;
  }

  function startGame() {
    overlay.classList.remove("show");
    resetGame();
    running = true;
    clearTimeout(loopId);
    draw();
    loopId = setTimeout(step, tickMs);
  }

  function togglePause() {
    if (!running) return;
    paused = !paused;
  }

  document.addEventListener("keydown", (e) => {
    const keyMap = {
      ArrowUp: "up", KeyW: "up",
      ArrowDown: "down", KeyS: "down",
      ArrowLeft: "left", KeyA: "left",
      ArrowRight: "right", KeyD: "right",
    };
    if (keyMap[e.code]) {
      e.preventDefault();
      setDirection(keyMap[e.code]);
    } else if (e.code === "Space") {
      e.preventDefault();
      togglePause();
    }
  });

  touchPad.addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-dir]");
    if (btn) setDirection(btn.dataset.dir);
  });

  // свайпы по канвасу
  let touchStart = null;
  canvas.addEventListener("touchstart", (e) => {
    const t = e.changedTouches[0];
    touchStart = { x: t.clientX, y: t.clientY };
  }, { passive: true });

  canvas.addEventListener("touchend", (e) => {
    if (!touchStart) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStart.x;
    const dy = t.clientY - touchStart.y;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return;
    if (Math.abs(dx) > Math.abs(dy)) {
      setDirection(dx > 0 ? "right" : "left");
    } else {
      setDirection(dy > 0 ? "down" : "up");
    }
    touchStart = null;
  }, { passive: true });

  startBtn.addEventListener("click", startGame);

  best = loadBest();
  bestEl.textContent = best;
  resetGame();
  draw();
  overlayTitle.textContent = "Змейка";
  overlayText.textContent = "Готовы начать?";
  overlay.classList.add("show");
})();
</script>
</body>
</html>
